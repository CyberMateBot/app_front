<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Возврат в CyberMate</title>
<link rel="icon" href="/favicon.png" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0b0c14;
    color: #f4f5fb;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 360px;
  }
  .logo {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    color: #a3a6bd;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: #5b57ff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 12px;
    background: #5b57ff;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/cybermate-logo.png" alt="CyberMate" />
    <div class="spinner" aria-hidden="true"></div>
    <h1>Возвращаемся в CyberMate…</h1>
    <p>Оплата обработана. Если приложение не открылось автоматически, нажмите на кнопку ниже.</p>
    <a class="btn" href="https://t.me/CyberMate_bot?startapp">Открыть в Telegram</a>
  </div>
  <script>
    (function () {
      window.location.replace('https://t.me/CyberMate_bot?startapp');
    })();
  </script>
</body>
</html>
