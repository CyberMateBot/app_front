<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#0a0b10" />
    <title>CyberMate</title>
    <script>
      (function () {
        // A plain browser visit (no Telegram launch context at all) — bounce straight
        // into the bot so the user lands in the real Mini App instead of seeing the
        // "SDK not found" screen. Legal pages (/legal/*.html) are separate files and
        // never load this script, so they stay reachable from any browser.
        var hostname = window.location.hostname || '';
        if (hostname === 'localhost' || hostname === '127.0.0.1') {
          return;
        }

        var search = window.location.search || '';
        if (/(?:^\?|&)no_redirect=1(?:&|$)/.test(search)) {
          return;
        }

        var hash = window.location.hash || '';
        if (/tgWebApp/i.test(hash)) {
          return;
        }

        var hasStoredLaunch = false;
        try {
          hasStoredLaunch = !!sessionStorage.getItem('cybermate.tg_launch_hash');
        } catch (e) {
          // Private mode / storage blocked — fall through to other checks.
        }
        if (hasStoredLaunch) {
          return;
        }

        var referrer = document.referrer || '';
        if (/telegram\.org|(?:^|\/\/)t\.me\//i.test(referrer)) {
          return;
        }

        var inIframe = false;
        try {
          inIframe = window.parent !== window;
        } catch (e) {
          inIframe = true;
        }
        if (inIframe) {
          return;
        }

        window.location.replace('https://t.me/CyberMate_bot?startapp');
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <script>
      (function () {
        var DESKTOP_PLATFORMS = { tdesktop: 1, macos: 1, web: 1, weba: 1, unigram: 1 };
        var PARENT_ORIGINS = [
          'https://web.telegram.org',
          'https://webk.telegram.org',
          'https://weba.telegram.org'
        ];

        var hash = window.location.hash.replace(/^#/, '');
        if (hash && hash.indexOf('tgWebApp') !== -1) {
          try { sessionStorage.setItem('cybermate.tg_launch_hash', hash); } catch (e) {}
        }

        function postFullscreen() {
          var envelope = JSON.stringify({
            eventType: 'web_app_request_fullscreen',
            eventData: {}
          });

          if (window.TelegramWebviewProxy && typeof window.TelegramWebviewProxy.postEvent === 'function') {
            window.TelegramWebviewProxy.postEvent('web_app_request_fullscreen', '{}');
            window.TelegramWebviewProxy.postEvent('web_app_request_viewport', '{}');
          }

          if (window.parent !== window) {
            try { window.parent.postMessage(envelope, '*'); } catch (e) {}
            for (var i = 0; i < PARENT_ORIGINS.length; i += 1) {
              try { window.parent.postMessage(envelope, PARENT_ORIGINS[i]); } catch (e) {}
            }
          }
        }

        function isDesktopPlatform(platform) {
          return !!DESKTOP_PLATFORMS[String(platform || '').toLowerCase()];
        }

        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) {
          return;
        }

        tg.ready();
        tg.expand();

        function isChatListMainAppLaunch(tg) {
          return hasBotChatContext(tg);
        }

        function isDesktopInBotChatPanel(tg) {
          if (isChatListMainAppLaunch(tg)) {
            return false;
          }

          var width = Number(tg.viewportStableWidth || tg.viewportWidth || window.innerWidth || 0);
          var height = Number(tg.viewportStableHeight || tg.viewportHeight || window.innerHeight || 0);
          if (width <= 0 || height <= 0) {
            return false;
          }
          if (width <= 560) {
            return true;
          }
          return height <= 900 && width <= 640;
        }

        function hasBotChatContext(tg) {
          var unsafe = tg.initDataUnsafe || {};
          if (unsafe.chat && unsafe.chat.id) return true;
          if (unsafe.chat_type) return true;
          if (unsafe.chat_instance) return true;

          var initData = tg.initData || '';
          if (!initData && hash) {
            initData = params.get('tgWebAppData') || '';
          }
          if (!initData) return false;

          var dataParams = new URLSearchParams(initData);
          return !!(dataParams.get('chat_type') || dataParams.get('chat_instance') || dataParams.get('chat'));
        }

        var params = new URLSearchParams(hash);
        var platform = tg.platform || params.get('tgWebAppPlatform') || '';

        if (!isDesktopPlatform(platform)) {
          return;
        }

        var launchMode = String(params.get('tgWebAppMode') || params.get('mode') || '').toLowerCase();
        if (launchMode === 'compact') {
          return;
        }

        if (isDesktopInBotChatPanel(tg)) {
          return;
        }

        if (typeof tg.requestFullscreen === 'function') {
          try { tg.requestFullscreen(); } catch (e) {}
        }

        postFullscreen();
        window.setTimeout(postFullscreen, 120);
        window.setTimeout(postFullscreen, 500);
      })();
    </script>
    <script>
      (function () {
        // Light theme has been removed — CyberMate is dark-only. Clear any
        // legacy stored preference so users who previously picked light are
        // migrated to dark, and always set data-theme='dark' before paint.
        localStorage.removeItem('cybermate-ui-theme');
        localStorage.removeItem('cybermate-theme');
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.colorScheme = 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
